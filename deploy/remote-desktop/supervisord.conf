[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid
user=root

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x820x24 -ac -nolisten tcp -noreset
priority=10
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openbox]
command=/usr/bin/openbox --sm-disable
directory=/app
user=jarvis
environment=DISPLAY=":99",HOME="/home/jarvis",XDG_RUNTIME_DIR="/run/pulse"
priority=20
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pulseaudio]
command=/bin/sh -lc 'pulseaudio -n --daemonize=no --exit-idle-time=-1 --log-target=stderr --load="module-native-protocol-unix socket=/run/pulse/native auth-anonymous=1" --load="module-null-sink sink_name=jarvis_sink rate=24000 channels=1"'
user=jarvis
environment=HOME="/home/jarvis",XDG_RUNTIME_DIR="/run/pulse",PULSE_RUNTIME_PATH="/run/pulse"
priority=25
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:vncserver]
command=/usr/bin/X0tigervnc -display :99 -rfbport 5900 -localhost yes -SecurityTypes None -AlwaysShared -UseBlacklist=0 -FrameRate 30 -CompareFB=2
user=jarvis
environment=HOME="/home/jarvis",DISPLAY=":99"
priority=30
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:websockify]
command=/usr/bin/websockify --heartbeat 30 127.0.0.1:6080 127.0.0.1:5900
priority=40
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0



[program:audio-bridge]
command=/bin/sh -lc 'cd /opt/jarvis-remote && python audio_bridge.py'
directory=/opt/jarvis-remote
user=jarvis
environment=HOME="/home/jarvis",PULSE_SERVER="unix:/run/pulse/native",PULSE_RUNTIME_PATH="/run/pulse"
priority=45
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=50
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0


[program:jarvis]
command=/bin/sh -lc 'cd /app && export DISPLAY=:99 HOME=/home/jarvis QT_QPA_PLATFORM=xcb QT_X11_NO_MITSHM=1 QTWEBENGINE_DISABLE_SANDBOX=1 JARVIS_CLI=1 JARVIS_SKIP_CLAP_GATE=1 PYTHONUNBUFFERED=1 PYTHONIOENCODING=utf-8:backslashreplace XDG_RUNTIME_DIR=/run/pulse PULSE_RUNTIME_PATH=/run/pulse PULSE_SERVER=unix:/run/pulse/native PULSE_SINK=jarvis_sink PULSE_SOURCE=fifo_input && echo "[JARVIS remote] waiting for PulseAudio" && until pactl info >/dev/null 2>&1; do sleep 0.25; done && echo "[JARVIS remote] loading microphone FIFO source" && pactl load-module module-pipe-source file=/run/pulse/mic.pipe && echo "[JARVIS remote] sinks:" && pactl list short sinks && echo "[JARVIS remote] sources:" && pactl list short sources && pactl set-default-sink jarvis_sink && pactl set-default-source fifo_input && echo "[JARVIS remote] launching original scripts/jarvis"; dbus-run-session -- ./scripts/jarvis; code=$?; echo "[JARVIS remote] original launcher exited with code $code"; sleep 5; exit $code'
directory=/app
user=jarvis
environment=DISPLAY=":99",HOME="/home/jarvis",QT_QPA_PLATFORM="xcb",QT_X11_NO_MITSHM="1",QTWEBENGINE_DISABLE_SANDBOX="1",JARVIS_CLI="1",JARVIS_SKIP_CLAP_GATE="1",PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8:backslashreplace",XDG_RUNTIME_DIR="/run/pulse",PULSE_RUNTIME_PATH="/run/pulse",PULSE_SERVER="unix:/run/pulse/native",PULSE_SINK="jarvis_sink",PULSE_SOURCE="jarvis_mic"
priority=60
autostart=true
autorestart=true
startsecs=8
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
