[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid
user=root

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x820x24 -ac -nolisten tcp -noreset
priority=10
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openbox]
command=/usr/bin/openbox --sm-disable
directory=/app
user=jarvis
environment=DISPLAY=":99",HOME="/home/jarvis",XDG_RUNTIME_DIR="/run/pulse"
priority=20
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pulseaudio]
command=/bin/sh -lc 'pulseaudio -n --daemonize=no --exit-idle-time=-1 --log-target=stderr --load="module-native-protocol-unix socket=/run/pulse/native auth-anonymous=1" --load="module-null-sink sink_name=jarvis_sink rate=24000 channels=1" --load="module-pipe-source source_name=jarvis_mic file=/run/pulse/mic.pipe format=s16le rate=16000 channels=1"'
user=jarvis
environment=HOME="/home/jarvis",XDG_RUNTIME_DIR="/run/pulse",PULSE_RUNTIME_PATH="/run/pulse"
priority=25
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -localhost -forever -shared -rfbport 5900 -nopw -xkb -noxdamage
user=jarvis
environment=HOME="/home/jarvis",DISPLAY=":99"
priority=30
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:websockify]
command=/usr/bin/websockify --heartbeat 30 127.0.0.1:6080 127.0.0.1:5900
priority=40
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:audio-bridge]
command=/bin/sh -lc 'cd /opt/jarvis-remote && python audio_bridge.py'
directory=/opt/jarvis-remote
user=jarvis
environment=HOME="/home/jarvis",PULSE_SERVER="unix:/run/pulse/native",PULSE_RUNTIME_PATH="/run/pulse"
priority=45
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=50
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:jarvis]
command=/bin/sh -lc 'cd /app && export DISPLAY=:99 HOME=/home/jarvis QT_QPA_PLATFORM=xcb QT_X11_NO_MITSHM=1 QTWEBENGINE_DISABLE_SANDBOX=1 JARVIS_CLI=1 JARVIS_SKIP_CLAP_GATE=1 XDG_RUNTIME_DIR=/run/pulse PULSE_RUNTIME_PATH=/run/pulse PULSE_SERVER=unix:/run/pulse/native PULSE_SINK=jarvis_sink PULSE_SOURCE=jarvis_mic && until pactl info >/dev/null 2>&1; do sleep 0.25; done && pactl set-default-sink jarvis_sink && pactl set-default-source jarvis_mic && dbus-run-session -- python main.py'
directory=/app
user=jarvis
environment=DISPLAY=":99",HOME="/home/jarvis",QT_QPA_PLATFORM="xcb",QT_X11_NO_MITSHM="1",QTWEBENGINE_DISABLE_SANDBOX="1",JARVIS_CLI="1",JARVIS_SKIP_CLAP_GATE="1",XDG_RUNTIME_DIR="/run/pulse",PULSE_RUNTIME_PATH="/run/pulse",PULSE_SERVER="unix:/run/pulse/native",PULSE_SINK="jarvis_sink",PULSE_SOURCE="jarvis_mic"
priority=60
autostart=true
autorestart=true
startsecs=8
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
