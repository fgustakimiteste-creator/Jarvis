[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x820x24 -ac -nolisten tcp -noreset
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openbox]
command=/usr/bin/openbox --sm-disable
directory=/app
user=jarvis
environment=DISPLAY=":99",HOME="/home/jarvis"
priority=20
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pulseaudio]
command=/bin/sh -lc 'pulseaudio --daemonize=no --exit-idle-time=-1 --log-target=stderr --load="module-null-sink sink_name=jarvis_sink" --load="module-null-source source_name=jarvis_mic"'
user=jarvis
environment=HOME="/home/jarvis",XDG_RUNTIME_DIR="/run/pulse",PULSE_RUNTIME_PATH="/run/pulse",DISPLAY=":99"
priority=25
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -localhost -forever -shared -rfbport 5900 -nopw -xkb
user=jarvis
environment=HOME="/home/jarvis",DISPLAY=":99"
priority=30
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:websockify]
command=/usr/bin/websockify --heartbeat 30 127.0.0.1:6080 127.0.0.1:5900
priority=40
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=50
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:jarvis]
command=/bin/sh -lc 'cd /app && export DISPLAY=:99 HOME=/home/jarvis QT_QPA_PLATFORM=xcb QT_X11_NO_MITSHM=1 QTWEBENGINE_DISABLE_SANDBOX=1 JARVIS_CLI=1 JARVIS_SKIP_CLAP_GATE=1 PULSE_RUNTIME_PATH=/run/pulse PULSE_SOURCE=jarvis_mic PULSE_SINK=jarvis_sink && dbus-run-session -- python main.py'
directory=/app
user=jarvis
environment=DISPLAY=":99",HOME="/home/jarvis",QT_QPA_PLATFORM="xcb",QT_X11_NO_MITSHM="1",QTWEBENGINE_DISABLE_SANDBOX="1",JARVIS_CLI="1",JARVIS_SKIP_CLAP_GATE="1",PULSE_RUNTIME_PATH="/run/pulse",PULSE_SOURCE="jarvis_mic",PULSE_SINK="jarvis_sink"
priority=60
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
